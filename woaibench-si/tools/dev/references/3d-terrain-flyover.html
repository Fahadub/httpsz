<!doctype html>
<!-- WB-ORACLE -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terrain Fly-over</title>
<style>
  :root { --panel: rgba(12,16,24,.62); --line: rgba(255,255,255,.14); --text: #f2f5fa; --muted: #b5bfcf; --accent: #ffcf7a; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: #0b0f17; color: var(--text); font: 13px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  .panel { position: fixed; top: 14px; inset-inline-start: 14px; width: 270px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; backdrop-filter: blur(10px); display: grid; gap: 12px; }
  h1 { margin: 0; font-size: 15px; letter-spacing: .04em; }
  h1 small { display: block; color: var(--muted); font-weight: 500; font-size: 12px; letter-spacing: 0; margin-top: 2px; }
  label { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; margin-bottom: 4px; }
  label b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .row { display: flex; gap: 8px; }
  input[type=number] { width: 100%; min-width: 0; background: rgba(255,255,255,.08); border: 1px solid var(--line); color: var(--text); border-radius: 10px; padding: 8px 10px; font: inherit; }
  button { font: inherit; font-weight: 600; color: var(--text); background: rgba(255,255,255,.1); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; cursor: pointer; white-space: nowrap; min-height: 36px; }
  button:hover { background: rgba(255,255,255,.16); }
  #mode[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  .hud { position: fixed; bottom: 14px; inset-inline-end: 14px; display: flex; gap: 8px; }
  .hud span { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-variant-numeric: tabular-nums; backdrop-filter: blur(8px); }
  .help { color: var(--muted); font-size: 11px; margin: 0; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (max-width: 600px) {
    .panel { top: auto; bottom: 10px; inset-inline: 10px; width: auto; padding: 10px 12px; gap: 8px; grid-template-columns: 1fr 1fr; }
    .panel h1, .panel .help { display: none; }
    .hud { top: 10px; bottom: auto; inset-inline-end: 10px; }
  }
</style>
</head>
<body>
<canvas id="gl" tabindex="0" role="img" aria-label="Procedurally generated landscape seen from a flying camera"></canvas>
<div class="panel">
  <h1>Terrain Fly-over<small>Seeded fractal landscape · WebGL</small></h1>
  <div><label for="sun">Time of day <b id="sun-val">10:00</b></label><input type="range" id="sun" min="0" max="180" value="60"></div>
  <div><label for="seed">Seed</label><div class="row"><input type="number" id="seed" value="1337" min="0" max="999999"><button type="button" id="regenerate">Regenerate</button></div></div>
  <div class="row"><button type="button" id="mode" aria-pressed="false">Manual flight</button></div>
  <p class="help">Manual: WASD / arrows move · drag to look · Q/E down/up</p>
</div>
<div class="hud" aria-live="off"><span id="alt">Alt 0 m</span><span id="fps">— fps</span></div>

<script>
(() => {
  'use strict';
  const N = 257, SIZE = 480, HMAX = 70, SEA = 6;
  // ---------- math ----------
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
  const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
  const scl = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const norm = (a) => { const l = Math.hypot(...a) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
  const mul = (a, b) => { const o = new Float32Array(16); for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) o[c * 4 + r] = a[r] * b[c * 4] + a[4 + r] * b[c * 4 + 1] + a[8 + r] * b[c * 4 + 2] + a[12 + r] * b[c * 4 + 3]; return o; };
  const persp = (f, a, n, fa) => { const t = 1 / Math.tan(f / 2); return [t / a, 0, 0, 0, 0, t, 0, 0, 0, 0, (fa + n) / (n - fa), -1, 0, 0, 2 * fa * n / (n - fa), 0]; };
  const lookAt = (e, c, u) => { const z = norm(sub(e, c)), x = norm(cross(u, z)), y = cross(z, x); return [x[0], y[0], z[0], 0, x[1], y[1], z[1], 0, x[2], y[2], z[2], 0, -dot(x, e), -dot(y, e), -dot(z, e), 1]; };

  // ---------- seeded noise ----------
  function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function makeNoise(seed) {
    const rnd = mulberry32(seed), p = new Uint8Array(512), g = [];
    const perm = [...Array(256).keys()];
    for (let i = 255; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [perm[i], perm[j]] = [perm[j], perm[i]]; }
    for (let i = 0; i < 512; i++) p[i] = perm[i & 255];
    for (let i = 0; i < 256; i++) { const a = rnd() * Math.PI * 2; g.push([Math.cos(a), Math.sin(a)]); }
    const fade = (t) => t * t * t * (t * (t * 6 - 15) + 10);
    return (x, y) => {
      const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, X = xi & 255, Y = yi & 255;
      const gd = (h, dx, dy) => { const v = g[h]; return v[0] * dx + v[1] * dy; };
      const n00 = gd(p[X + p[Y]], xf, yf), n10 = gd(p[X + 1 + p[Y]], xf - 1, yf), n01 = gd(p[X + p[Y + 1]], xf, yf - 1), n11 = gd(p[X + 1 + p[Y + 1]], xf - 1, yf - 1);
      const u = fade(xf), v = fade(yf);
      return (n00 + u * (n10 - n00)) + v * ((n01 + u * (n11 - n01)) - (n00 + u * (n10 - n00)));
    };
  }
  let heights = new Float32Array(N * N);
  function generate(seed) {
    const noise = makeNoise(seed), warp = makeNoise(seed + 101);
    for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
      const x = i / (N - 1), z = j / (N - 1);
      const wx = x * 3 + warp(x * 2, z * 2) * 0.6, wz = z * 3 + warp(x * 2 + 5.2, z * 2 + 1.3) * 0.6;
      let f = 0, amp = 1, freq = 1, sum = 0;
      for (let o = 0; o < 6; o++) { f += noise(wx * freq, wz * freq) * amp; sum += amp; amp *= 0.5; freq *= 2.03; }
      f /= sum;
      const ridge = 1 - Math.abs(noise(wx * 1.3 + 7, wz * 1.3 + 3));
      let h = f * 0.75 + Math.pow(ridge, 3) * 0.55 - 0.08;
      const d = Math.hypot(x - 0.5, z - 0.5) * 2;
      h = h * (1 - 0.35 * d * d) + 0.12;
      heights[j * N + i] = Math.max(-0.2, h) * HMAX;
    }
  }
  function groundAt(x, z) {
    const fx = (x / SIZE + 0.5) * (N - 1), fz = (z / SIZE + 0.5) * (N - 1);
    const i = Math.max(0, Math.min(N - 2, Math.floor(fx))), j = Math.max(0, Math.min(N - 2, Math.floor(fz)));
    const u = Math.max(0, Math.min(1, fx - i)), v = Math.max(0, Math.min(1, fz - j));
    const h = (a, b) => heights[b * N + a];
    return (h(i, j) * (1 - u) + h(i + 1, j) * u) * (1 - v) + (h(i, j + 1) * (1 - u) + h(i + 1, j + 1) * u) * v;
  }

  // ---------- GL ----------
  const canvas = document.getElementById('gl');
  const gl = canvas.getContext('webgl', { antialias: true, preserveDrawingBuffer: true, alpha: false });
  if (!gl) { document.body.insertAdjacentHTML('beforeend', '<p style="padding:20px">WebGL is unavailable.</p>'); return; }
  gl.getExtension('OES_element_index_uint');
  function program(vs, fs) {
    const p = gl.createProgram();
    for (const [t, src] of [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]]) { const s = gl.createShader(t); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); gl.attachShader(p, s); }
    gl.linkProgram(p); if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    const u = {}; for (let i = 0; i < gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS); i++) { const n = gl.getActiveUniform(p, i).name; u[n] = gl.getUniformLocation(p, n); }
    return { p, u };
  }
  const SKY_COMMON = `
    uniform vec3 uSunDir; uniform vec3 uSkyTop; uniform vec3 uSkyHorizon; uniform vec3 uSunColor;
    vec3 skyColor(vec3 d){ float t = clamp(d.y*1.6+0.1,0.0,1.0); vec3 c = mix(uSkyHorizon, uSkyTop, pow(t,0.7));
      float s = max(dot(d, uSunDir), 0.0); c += uSunColor * (pow(s, 600.0)*6.0 + pow(s, 12.0)*0.25); return c; }`;
  const TERRAIN_VS = `attribute vec3 aPos; attribute vec3 aNrm; uniform mat4 uVP; varying vec3 vW; varying vec3 vN;
    void main(){ vW = aPos; vN = aNrm; gl_Position = uVP * vec4(aPos,1.0); }`;
  const TERRAIN_FS = `precision highp float; varying vec3 vW; varying vec3 vN; uniform vec3 uEye; uniform float uSea, uHmax, uFogDen; ${SKY_COMMON}
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
    void main(){
      vec3 N = normalize(vN); float h = vW.y; float slope = 1.0 - N.y;
      float n = hash(floor(vW.xz*0.8))*0.06;
      vec3 sand = vec3(0.76,0.70,0.52), grass = vec3(0.30,0.45,0.20), grass2 = vec3(0.42,0.50,0.25), rock = vec3(0.42,0.39,0.36), snow = vec3(0.95,0.96,0.98);
      vec3 col = mix(grass, grass2, smoothstep(10.0, 30.0, h) + n);
      col = mix(sand, col, smoothstep(uSea+0.5, uSea+3.0, h));
      col = mix(col, rock, smoothstep(0.28, 0.45, slope + n));
      col = mix(col, snow, smoothstep(uHmax*0.55, uHmax*0.68, h + n*20.0) * (1.0 - smoothstep(0.35, 0.55, slope)));
      col *= 0.92 + n;
      float diff = max(dot(N, uSunDir), 0.0);
      vec3 amb = mix(uSkyHorizon, uSkyTop, 0.5) * 0.45 * (0.6 + 0.4*N.y);
      vec3 lit = col * (uSunColor * diff * 1.1 + amb);
      float d = length(vW - uEye); vec3 dir = (vW - uEye)/d;
      float fog = 1.0 - exp(-pow(d*uFogDen, 1.6));
      gl_FragColor = vec4(pow(mix(lit, skyColor(dir), fog), vec3(1.0/2.2)), 1.0);
    }`;
  const WATER_VS = `attribute vec3 aPos; uniform mat4 uVP; uniform float uSea; varying vec3 vW; void main(){ vW = vec3(aPos.x, uSea, aPos.z); gl_Position = uVP * vec4(vW,1.0); }`;
  const WATER_FS = `precision highp float; varying vec3 vW; uniform vec3 uEye; uniform float uTime, uFogDen; ${SKY_COMMON}
    void main(){
      vec2 p = vW.xz; float t = uTime;
      vec3 N = normalize(vec3(sin(p.x*0.21+t*1.3)*0.06 + sin(p.x*0.53-p.y*0.37+t*2.1)*0.04 + sin(p.y*1.1+t*2.7)*0.02, 1.0,
                              cos(p.y*0.19+t*1.1)*0.06 + cos(p.x*0.41+p.y*0.6+t*1.7)*0.04 + cos(p.x*1.3-t*2.3)*0.02));
      vec3 V = normalize(uEye - vW); float d = length(uEye - vW);
      float fres = 0.04 + 0.96*pow(1.0 - max(dot(N,V),0.0), 5.0);
      vec3 refl = skyColor(reflect(-V, N));
      vec3 deep = vec3(0.04,0.16,0.22) * (0.4 + 0.6*max(uSunDir.y,0.0));
      vec3 col = mix(deep, refl, fres);
      float fog = 1.0 - exp(-pow(d*uFogDen, 1.6));
      gl_FragColor = vec4(pow(mix(col, skyColor(-V), fog), vec3(1.0/2.2)), 0.92);
    }`;
  const SKY_VS = `attribute vec3 aPos; varying vec2 vP; void main(){ vP = aPos.xy; gl_Position = vec4(aPos.xy, 0.9999, 1.0); }`;
  const SKY_FS = `precision highp float; varying vec2 vP; uniform mat4 uInvVP; ${SKY_COMMON}
    void main(){ vec4 a = uInvVP * vec4(vP, -1.0, 1.0); vec4 b = uInvVP * vec4(vP, 1.0, 1.0); vec3 d = normalize(b.xyz/b.w - a.xyz/a.w);
      gl_FragColor = vec4(pow(skyColor(d), vec3(1.0/2.2)), 1.0); }`;
  const terrainP = program(TERRAIN_VS, TERRAIN_FS), waterP = program(WATER_VS, WATER_FS), skyP = program(SKY_VS, SKY_FS);
  const buf = (data, target = gl.ARRAY_BUFFER) => { const b = gl.createBuffer(); gl.bindBuffer(target, b); gl.bufferData(target, data, gl.STATIC_DRAW); return b; };

  // static index buffer for the grid
  const idx = new Uint32Array((N - 1) * (N - 1) * 6);
  for (let j = 0, k = 0; j < N - 1; j++) for (let i = 0; i < N - 1; i++) { const a = j * N + i; idx.set([a, a + N, a + 1, a + 1, a + N, a + N + 1], k); k += 6; }
  const ibo = buf(idx, gl.ELEMENT_ARRAY_BUFFER);
  let vbo = null, nbo = null;
  function buildMesh(seed) {
    generate(seed);
    const pos = new Float32Array(N * N * 3), nrm = new Float32Array(N * N * 3), cell = SIZE / (N - 1);
    for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
      const k = j * N + i;
      pos.set([i * cell - SIZE / 2, heights[k], j * cell - SIZE / 2], k * 3);
      const hl = heights[j * N + Math.max(0, i - 1)], hr = heights[j * N + Math.min(N - 1, i + 1)], hd = heights[Math.max(0, j - 1) * N + i], hu = heights[Math.min(N - 1, j + 1) * N + i];
      nrm.set(norm([hl - hr, 2 * cell, hd - hu]), k * 3);
    }
    if (vbo) { gl.deleteBuffer(vbo); gl.deleteBuffer(nbo); }
    vbo = buf(pos); nbo = buf(nrm);
  }
  const quad = buf(new Float32Array([-1, -1, 0, 1, -1, 0, 1, 1, 0, -1, -1, 0, 1, 1, 0, -1, 1, 0]));
  const W2 = SIZE * 2;
  const waterBuf = buf(new Float32Array([-W2, 0, -W2, W2, 0, -W2, W2, 0, W2, -W2, 0, -W2, W2, 0, W2, -W2, 0, W2]));

  // ---------- inverse matrix for sky rays ----------
  function invert(m) {
    const inv = new Float32Array(16);
    inv[0] = m[5] * m[10] * m[15] - m[5] * m[11] * m[14] - m[9] * m[6] * m[15] + m[9] * m[7] * m[14] + m[13] * m[6] * m[11] - m[13] * m[7] * m[10];
    inv[4] = -m[4] * m[10] * m[15] + m[4] * m[11] * m[14] + m[8] * m[6] * m[15] - m[8] * m[7] * m[14] - m[12] * m[6] * m[11] + m[12] * m[7] * m[10];
    inv[8] = m[4] * m[9] * m[15] - m[4] * m[11] * m[13] - m[8] * m[5] * m[15] + m[8] * m[7] * m[13] + m[12] * m[5] * m[11] - m[12] * m[7] * m[9];
    inv[12] = -m[4] * m[9] * m[14] + m[4] * m[10] * m[13] + m[8] * m[5] * m[14] - m[8] * m[6] * m[13] - m[12] * m[5] * m[10] + m[12] * m[6] * m[9];
    inv[1] = -m[1] * m[10] * m[15] + m[1] * m[11] * m[14] + m[9] * m[2] * m[15] - m[9] * m[3] * m[14] - m[13] * m[2] * m[11] + m[13] * m[3] * m[10];
    inv[5] = m[0] * m[10] * m[15] - m[0] * m[11] * m[14] - m[8] * m[2] * m[15] + m[8] * m[3] * m[14] + m[12] * m[2] * m[11] - m[12] * m[3] * m[10];
    inv[9] = -m[0] * m[9] * m[15] + m[0] * m[11] * m[13] + m[8] * m[1] * m[15] - m[8] * m[3] * m[13] - m[12] * m[1] * m[11] + m[12] * m[3] * m[9];
    inv[13] = m[0] * m[9] * m[14] - m[0] * m[10] * m[13] - m[8] * m[1] * m[14] + m[8] * m[2] * m[13] + m[12] * m[1] * m[10] - m[12] * m[2] * m[9];
    inv[2] = m[1] * m[6] * m[15] - m[1] * m[7] * m[14] - m[5] * m[2] * m[15] + m[5] * m[3] * m[14] + m[13] * m[2] * m[7] - m[13] * m[3] * m[6];
    inv[6] = -m[0] * m[6] * m[15] + m[0] * m[7] * m[14] + m[4] * m[2] * m[15] - m[4] * m[3] * m[14] - m[12] * m[2] * m[7] + m[12] * m[3] * m[6];
    inv[10] = m[0] * m[5] * m[15] - m[0] * m[7] * m[13] - m[4] * m[1] * m[15] + m[4] * m[3] * m[13] + m[12] * m[1] * m[7] - m[12] * m[3] * m[5];
    inv[14] = -m[0] * m[5] * m[14] + m[0] * m[6] * m[13] + m[4] * m[1] * m[14] - m[4] * m[2] * m[13] - m[12] * m[1] * m[6] + m[12] * m[2] * m[5];
    inv[3] = -m[1] * m[6] * m[11] + m[1] * m[7] * m[10] + m[5] * m[2] * m[11] - m[5] * m[3] * m[10] - m[9] * m[2] * m[7] + m[9] * m[3] * m[6];
    inv[7] = m[0] * m[6] * m[11] - m[0] * m[7] * m[10] - m[4] * m[2] * m[11] + m[4] * m[3] * m[10] + m[8] * m[2] * m[7] - m[8] * m[3] * m[6];
    inv[11] = -m[0] * m[5] * m[11] + m[0] * m[7] * m[9] + m[4] * m[1] * m[11] - m[4] * m[3] * m[9] - m[8] * m[1] * m[7] + m[8] * m[3] * m[5];
    inv[15] = m[0] * m[5] * m[10] - m[0] * m[6] * m[9] - m[4] * m[1] * m[10] + m[4] * m[2] * m[9] + m[8] * m[1] * m[6] - m[8] * m[2] * m[5];
    const det = m[0] * inv[0] + m[1] * inv[4] + m[2] * inv[8] + m[3] * inv[12];
    for (let i = 0; i < 16; i++) inv[i] /= det;
    return inv;
  }

  // ---------- lighting by time of day ----------
  const lerp3 = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
  function lightFor(deg) {
    const a = deg * Math.PI / 180;
    const sun = norm([Math.cos(a) * 0.9, Math.sin(a) * 0.95 + 0.04, 0.35]);
    const e = Math.max(0, Math.sin(a));
    const warm = 1 - Math.min(1, e * 2.2);
    return {
      sun,
      top: lerp3([0.16, 0.36, 0.72], [0.10, 0.14, 0.32], warm * 0.8),
      horizon: lerp3([0.70, 0.80, 0.92], [0.98, 0.58, 0.36], warm),
      color: scl(lerp3([1.0, 0.96, 0.88], [1.0, 0.55, 0.30], warm), 0.35 + 0.75 * Math.min(1, e * 3)),
    };
  }

  // ---------- camera path ----------
  const CTRL = Array.from({ length: 9 }, (_, i) => { const a = i / 9 * Math.PI * 2; const r = 120 + Math.sin(i * 2.7) * 45; return [Math.cos(a) * r, 0, Math.sin(a) * r * 0.85]; });
  function catmull(t) {
    const n = CTRL.length, s = ((t % 1) + 1) % 1 * n, i = Math.floor(s), f = s - i;
    const p0 = CTRL[(i - 1 + n) % n], p1 = CTRL[i], p2 = CTRL[(i + 1) % n], p3 = CTRL[(i + 2) % n];
    return [0, 2].map((k) => 0.5 * ((2 * p1[k]) + (-p0[k] + p2[k]) * f + (2 * p0[k] - 5 * p1[k] + 4 * p2[k] - p3[k]) * f * f + (-p0[k] + 3 * p1[k] - 3 * p2[k] + p3[k]) * f * f * f));
  }
  function safeHeight(x, z, aheadX, aheadZ) {
    let h = Math.max(groundAt(x, z), SEA);
    for (let k = 1; k <= 6; k++) h = Math.max(h, groundAt(x + aheadX * k * 8, z + aheadZ * k * 8) - k * 1.5);
    return h + 14;
  }

  // ---------- state & loop ----------
  const ui = { sun: document.getElementById('sun'), seed: document.getElementById('seed'), mode: document.getElementById('mode'), fps: document.getElementById('fps'), alt: document.getElementById('alt') };
  let manual = false, pathT = 0, camY = 40, renderScale = 1, frames = 0, fpsT = 0, slow = 0, fast = 0;
  const free = { pos: [0, 50, 160], yaw: Math.PI, pitch: -0.15 };
  const keys = new Set();
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  function resize() {
    const dpr = Math.min(2, window.devicePixelRatio || 1) * renderScale;
    canvas.width = Math.max(1, Math.round(innerWidth * dpr)); canvas.height = Math.max(1, Math.round(innerHeight * dpr));
  }
  function attrib(prog, name, b, size = 3) { const loc = gl.getAttribLocation(prog.p, name); if (loc < 0) return; gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, size, gl.FLOAT, false, 0, 0); }
  function setSky(prog, L) { gl.uniform3fv(prog.u.uSunDir, L.sun); gl.uniform3fv(prog.u.uSkyTop, L.top); gl.uniform3fv(prog.u.uSkyHorizon, L.horizon); gl.uniform3fv(prog.u.uSunColor, L.color); }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    // adaptive resolution
    frames++; fpsT += dt;
    if (fpsT >= 0.5) {
      const fps = frames / fpsT; ui.fps.textContent = `${Math.round(fps)} fps`;
      if (fps < 40) { slow++; fast = 0; } else if (fps > 57) { fast++; slow = 0; } else { slow = fast = 0; }
      if (slow >= 1 && renderScale > 0.35) { renderScale = Math.max(0.35, renderScale * 0.75); resize(); slow = 0; }
      if (fast >= 4 && renderScale < 1) { renderScale = Math.min(1, renderScale * 1.15); resize(); fast = 0; }
      frames = 0; fpsT = 0;
    }
    let eye, target;
    if (!manual) {
      pathT += dt * (reduced ? 0.004 : 0.012);
      const [x, z] = catmull(pathT), [ax, az] = catmull(pathT + 0.01);
      const dir = norm([ax - x, 0, az - z]);
      camY += (safeHeight(x, z, dir[0], dir[2]) - camY) * Math.min(1, dt * 2.5);
      camY = Math.max(camY, groundAt(x, z) + 8);
      eye = [x, camY, z];
      const [lx, lz] = catmull(pathT + 0.03);
      target = [lx, safeHeight(lx, lz, dir[0], dir[2]) - 6, lz];
    } else {
      const sp = 60 * dt, fwd = [Math.sin(free.yaw), 0, Math.cos(free.yaw)], right = [Math.cos(free.yaw), 0, -Math.sin(free.yaw)];
      if (keys.has('w') || keys.has('arrowup')) free.pos = add(free.pos, scl(fwd, -sp));
      if (keys.has('s') || keys.has('arrowdown')) free.pos = add(free.pos, scl(fwd, sp));
      if (keys.has('a') || keys.has('arrowleft')) free.pos = add(free.pos, scl(right, -sp));
      if (keys.has('d') || keys.has('arrowright')) free.pos = add(free.pos, scl(right, sp));
      if (keys.has('e')) free.pos[1] += sp; if (keys.has('q')) free.pos[1] -= sp;
      free.pos[1] = Math.max(free.pos[1], Math.max(groundAt(free.pos[0], free.pos[2]), SEA) + 3);
      eye = free.pos;
      const look = [-Math.sin(free.yaw) * Math.cos(free.pitch), Math.sin(free.pitch), -Math.cos(free.yaw) * Math.cos(free.pitch)];
      target = add(eye, look);
    }
    ui.alt.textContent = `Alt ${Math.round(eye[1] - SEA)} m`;
    const L = lightFor(+ui.sun.value);
    const aspect = canvas.width / canvas.height;
    const proj = persp(aspect < 1 ? 1.15 : 0.95, aspect, 0.5, 1400);
    const view = lookAt(eye, target, [0, 1, 0]);
    const vp = mul(proj, view);
    const fogDen = 1 / 520;

    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    // sky
    gl.disable(gl.DEPTH_TEST);
    gl.useProgram(skyP.p); attrib(skyP, 'aPos', quad); setSky(skyP, L);
    gl.uniformMatrix4fv(skyP.u.uInvVP, false, invert(vp));
    gl.drawArrays(gl.TRIANGLES, 0, 6);
    gl.enable(gl.DEPTH_TEST);
    // terrain
    gl.useProgram(terrainP.p); attrib(terrainP, 'aPos', vbo); attrib(terrainP, 'aNrm', nbo); setSky(terrainP, L);
    gl.uniformMatrix4fv(terrainP.u.uVP, false, vp); gl.uniform3fv(terrainP.u.uEye, eye);
    gl.uniform1f(terrainP.u.uSea, SEA); gl.uniform1f(terrainP.u.uHmax, HMAX); gl.uniform1f(terrainP.u.uFogDen, fogDen);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ibo);
    gl.drawElements(gl.TRIANGLES, idx.length, gl.UNSIGNED_INT, 0);
    // water
    gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.useProgram(waterP.p);
    const nloc = gl.getAttribLocation(terrainP.p, 'aNrm'); if (nloc >= 0) gl.disableVertexAttribArray(nloc);
    attrib(waterP, 'aPos', waterBuf); setSky(waterP, L);
    gl.uniformMatrix4fv(waterP.u.uVP, false, vp); gl.uniform3fv(waterP.u.uEye, eye); gl.uniform1f(waterP.u.uSea, SEA);
    gl.uniform1f(waterP.u.uTime, now / 1000); gl.uniform1f(waterP.u.uFogDen, fogDen);
    gl.drawArrays(gl.TRIANGLES, 0, 6);
    gl.disable(gl.BLEND);
    requestAnimationFrame(frame);
  }

  // ---------- UI ----------
  function sunLabel() { const h = 6 + (+ui.sun.value / 180) * 12; document.getElementById('sun-val').textContent = `${String(Math.floor(h)).padStart(2, '0')}:${String(Math.round((h % 1) * 60) % 60).padStart(2, '0')}`; }
  ui.sun.addEventListener('input', sunLabel);
  document.getElementById('regenerate').addEventListener('click', () => { const s = Math.max(0, Math.floor(+ui.seed.value || 0)); ui.seed.value = s; buildMesh(s); });
  ui.seed.addEventListener('keydown', (e) => { if (e.key === 'Enter') document.getElementById('regenerate').click(); });
  ui.mode.addEventListener('click', () => {
    manual = !manual; ui.mode.setAttribute('aria-pressed', String(manual)); ui.mode.textContent = manual ? 'Auto flight' : 'Manual flight';
    if (manual) { const [x, z] = catmull(pathT), [ax, az] = catmull(pathT + 0.01); free.pos = [x, camY, z]; free.yaw = Math.atan2(-(ax - x), -(az - z)); free.pitch = -0.12; canvas.focus(); }
  });
  window.addEventListener('keydown', (e) => { if (!manual || e.target.tagName === 'INPUT') return; const k = e.key.toLowerCase(); if (['w', 'a', 's', 'd', 'q', 'e', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) { keys.add(k); e.preventDefault(); } });
  window.addEventListener('keyup', (e) => keys.delete(e.key.toLowerCase()));
  window.addEventListener('blur', () => keys.clear());
  let drag = null;
  canvas.addEventListener('pointerdown', (e) => { if (!manual) return; drag = { x: e.clientX, y: e.clientY }; canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointermove', (e) => { if (!drag) return; free.yaw -= (e.clientX - drag.x) * 0.004; free.pitch = Math.max(-1.3, Math.min(1.3, free.pitch - (e.clientY - drag.y) * 0.004)); drag = { x: e.clientX, y: e.clientY }; });
  canvas.addEventListener('pointerup', () => { drag = null; });
  window.addEventListener('resize', resize);

  sunLabel(); buildMesh(1337); resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
