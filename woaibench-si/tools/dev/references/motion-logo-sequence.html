<!doctype html>
<!-- WB-ORACLE -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kestrel Maps — brand intro</title>
<style>
  :root { --ink: #0e1a1f; --deep: #0b2a30; --gold: #f2b544; --rust: #e0603f; --mist: #e8efe9; --muted: #9fb3b3; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--ink); color: var(--mist); font: 15px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; display: flex; flex-direction: column; }
  .stage { position: relative; flex: 1; min-height: 0; display: grid; place-items: center; overflow: hidden; }
  .bg { position: absolute; inset: -20%; background: radial-gradient(60% 50% at 50% 45%, #14424a 0%, var(--deep) 45%, var(--ink) 100%); }
  .bg2 { position: absolute; inset: -20%; background: radial-gradient(55% 45% at 45% 55%, rgba(224,96,63,.28), transparent 70%); opacity: 0; }
  .contours { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; }
  .contours path { fill: none; stroke: rgba(232,239,233,.13); stroke-width: 1.2; }
  .logo { position: relative; display: grid; justify-items: center; gap: 14px; text-align: center; padding: 0 16px; }
  .mark { width: clamp(96px, 18vw, 150px); height: auto; overflow: visible; }
  .mark .outline { fill: none; stroke: var(--mist); stroke-width: 2.2; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; }
  .mark .fill { fill: url(#kGrad); opacity: 0; }
  .mark .ring { fill: none; stroke: rgba(232,239,233,.35); stroke-width: 1.4; stroke-dasharray: 1; stroke-dashoffset: 1; }
  .word { font: 700 clamp(40px, 9vw, 96px)/1 ui-sans-serif, system-ui, "Helvetica Neue", Arial, sans-serif; letter-spacing: .14em; margin: 0; padding-inline-start: .14em; white-space: nowrap; }
  .letter { display: inline-block; opacity: 0; transform: translateY(.45em); }
  .tagline { margin: 0; color: var(--muted); font-size: clamp(14px, 2.2vw, 20px); letter-spacing: .06em; opacity: 0; transform: translateY(12px); }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 14px 20px 18px; background: rgba(8,16,19,.9); border-top: 1px solid rgba(255,255,255,.07); }
  button, select { font: inherit; font-weight: 600; color: var(--mist); background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12); border-radius: 10px; padding: 8px 14px; cursor: pointer; min-height: 40px; }
  select option { color: #111; }
  button[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
  .scrub { flex: 1 1 260px; display: flex; align-items: center; gap: 12px; }
  .scrub label { color: var(--muted); font-size: 13px; }
  #scrubber { flex: 1; accent-color: var(--gold); min-width: 120px; }
  #time { font: 600 14px ui-monospace, "SF Mono", Menlo, monospace; min-width: 64px; text-align: end; color: var(--gold); }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<div class="stage" aria-label="Kestrel Maps brand intro">
  <div class="bg" id="bg"></div>
  <div class="bg2" id="bg2"></div>
  <svg class="contours" id="contours" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <g id="contour-lines">
      <path d="M140 420c60-140 260-200 420-170s300 140 260 260-220 180-400 150-340-100-280-240z"/>
      <path d="M190 420c50-110 220-160 360-135s250 115 220 210-185 145-335 120-290-80-245-195z"/>
      <path d="M245 420c40-80 175-120 290-100s200 90 175 160-145 110-265 90-230-60-200-150z"/>
      <path d="M300 420c30-55 130-85 220-70s150 65 130 115-105 80-195 65-175-40-155-110z"/>
      <path d="M720 160c90-60 250-40 330 40s60 210-60 250-260-10-310-110 -50-130 40-180z"/>
      <path d="M760 190c70-45 195-30 255 30s45 160-45 190-200-10-240-85-40-100 30-135z"/>
      <path d="M800 220c50-30 140-20 180 20s30 110-30 130-140-5-165-60-30-65 15-90z"/>
      <path d="M60 760c120-80 300-60 420 0s280 40 360-20 260-60 360 20"/>
      <path d="M40 120c140 40 260 0 360-60s240-40 320 20"/>
    </g>
  </svg>
  <div class="logo">
    <svg class="mark" viewBox="0 0 120 120" role="img" aria-labelledby="mark-title">
      <title id="mark-title">Kestrel Maps mark</title>
      <defs><linearGradient id="kGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6c65b"/><stop offset=".55" stop-color="#f2b544"/><stop offset="1" stop-color="#e0603f"/></linearGradient></defs>
      <circle class="ring" cx="60" cy="60" r="54" pathLength="1"/>
      <path class="fill" d="M60 18l7 15-7 6-7-6zM16 66l44-25 44 25-20-1-24-11-24 11zM60 45l9 30-9 27-9-27z"/>
      <path class="outline" pathLength="1" d="M60 18l7 15-7 6-7-6zM16 66l44-25 44 25-20-1-24-11-24 11zM60 45l9 30-9 27-9-27z"/>
    </svg>
    <h1 class="word" aria-label="KESTREL"><span class="letter" aria-hidden="true">K</span><span class="letter" aria-hidden="true">E</span><span class="letter" aria-hidden="true">S</span><span class="letter" aria-hidden="true">T</span><span class="letter" aria-hidden="true">R</span><span class="letter" aria-hidden="true">E</span><span class="letter" aria-hidden="true">L</span></h1>
    <p class="tagline" id="tagline">Maps that know the terrain</p>
  </div>
</div>
<div class="controls">
  <button type="button" id="replay">Replay</button>
  <button type="button" id="play-pause" aria-pressed="false" aria-label="Pause">Pause</button>
  <div class="scrub"><label for="scrubber">Timeline</label><input type="range" id="scrubber" min="0" max="6000" step="10" value="0"><output id="time" for="scrubber">0.00 s</output></div>
  <label class="sr" for="speed">Playback speed</label>
  <select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select>
</div>
<script>
(() => {
  'use strict';
  const DURATION = 6000;
  const EASE = { out: 'cubic-bezier(.16,1,.3,1)', inOut: 'cubic-bezier(.65,0,.35,1)', back: 'cubic-bezier(.34,1.56,.64,1)' };
  const $ = (s) => document.querySelector(s);
  // Every timeline animation is created paused; a single master clock sets currentTime, so scrubbing is exact.
  const tracks = [];
  const track = (el, keyframes, start, dur, easing = EASE.out) => {
    const a = el.animate(keyframes, { duration: dur, delay: start, fill: 'both', easing });
    a.pause(); tracks.push(a); return a;
  };
  track($('.mark .ring'), [{ strokeDashoffset: 1 }, { strokeDashoffset: 0 }], 0, 1500, EASE.inOut);
  track($('.mark .outline'), [{ strokeDashoffset: 1, opacity: 1 }, { strokeDashoffset: 0, opacity: 1 }], 100, 1500, EASE.inOut);
  track($('.mark .outline'), [{ opacity: 1 }, { opacity: 0 }], 1700, 500, EASE.inOut).effect.updateTiming({ fill: 'forwards' });
  track($('.mark .fill'), [{ opacity: 0, transform: 'scale(.94)', transformOrigin: '60px 60px' }, { opacity: 1, transform: 'scale(1)', transformOrigin: '60px 60px' }], 1200, 1000, EASE.out);
  track($('.mark'), [{ transform: 'translateY(0)' }, { transform: 'translateY(-4px)' }, { transform: 'translateY(0)' }], 1900, 900, EASE.inOut);
  document.querySelectorAll('.letter').forEach((el, i) => {
    track(el, [{ opacity: 0, transform: 'translateY(.45em)' }, { opacity: 1, transform: 'translateY(0)' }], 2000 + i * 60, 760, EASE.back);
  });
  track($('#tagline'), [{ opacity: 0, transform: 'translateY(12px)', letterSpacing: '.18em' }, { opacity: 1, transform: 'translateY(0)', letterSpacing: '.06em' }], 3200, 1000, EASE.out);
  track($('#bg2'), [{ opacity: 0 }, { opacity: 1 }], 4200, 1800, EASE.inOut);
  track($('#bg'), [{ transform: 'scale(1) translate(0,0)' }, { transform: 'scale(1.08) translate(-1.5%,1%)' }], 4200, 1800, EASE.inOut);
  track($('#contours'), [{ opacity: 0, transform: 'translateX(-6%) scale(1.04)' }, { opacity: 1, transform: 'translateX(0) scale(1)' }], 4200, 1800, EASE.out);
  // Ambient loop after the sequence (not part of the scrubbable timeline).
  const ambient = $('#contour-lines').animate([{ transform: 'translate(0,0)' }, { transform: 'translate(-24px,10px)' }, { transform: 'translate(0,0)' }], { duration: 9000, iterations: Infinity, easing: 'ease-in-out' });

  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const scrubber = $('#scrubber'), timeOut = $('#time'), playBtn = $('#play-pause'), speedSel = $('#speed');
  let t = reduced ? DURATION : 0, playing = !reduced, speed = 1, last = performance.now(), scrubbing = false;
  if (reduced) { ambient.pause(); document.body.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 400 }); }

  function render() {
    for (const a of tracks) a.currentTime = t;
    scrubber.value = String(Math.round(t));
    timeOut.textContent = (t / 1000).toFixed(2) + ' s';
  }
  function setPlaying(p) {
    playing = p;
    playBtn.setAttribute('aria-pressed', String(!p));
    playBtn.textContent = p ? 'Pause' : 'Play';
    playBtn.setAttribute('aria-label', p ? 'Pause' : 'Play');
    if (!reduced) { if (p) ambient.play(); else ambient.pause(); }
    last = performance.now();
  }
  function tick(now) {
    const dt = now - last; last = now;
    if (playing && !scrubbing && t < DURATION) { t = Math.min(DURATION, t + dt * speed); render(); }
    requestAnimationFrame(tick);
  }
  $('#replay').addEventListener('click', () => { t = 0; render(); setPlaying(true); });
  playBtn.addEventListener('click', () => { if (!playing && t >= DURATION) t = 0; setPlaying(!playing); });
  scrubber.addEventListener('input', () => { scrubbing = true; if (playing) setPlaying(false); t = +scrubber.value; render(); });
  scrubber.addEventListener('change', () => { scrubbing = false; });
  speedSel.addEventListener('change', () => { speed = +speedSel.value; });
  document.addEventListener('keydown', (e) => { if (e.key === ' ' && e.target === document.body) { e.preventDefault(); playBtn.click(); } });

  playBtn.setAttribute('aria-pressed', String(!playing));
  if (!playing) { playBtn.textContent = 'Play'; playBtn.setAttribute('aria-label', 'Play'); }
  render();
  requestAnimationFrame((n) => { last = n; tick(n); });
})();
</script>
</body>
</html>
