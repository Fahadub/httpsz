<!doctype html>
<!-- WB-ORACLE -->
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weather icon set — animated</title>
<style>
  :root, [data-theme="dark"] {
    --bg: #0f1420; --card: #171e2d; --card-2: #1c2436; --line: rgba(255,255,255,.08); --text: #eef2f8; --muted: #93a0b8;
    --sun: #ffc247; --sun-core: #ffdf8a; --cloud: #dbe4f0; --cloud-dark: #8e9bb1; --rain: #6cb8ff; --snow: #e9f4ff; --bolt: #ffd84a; --wind: #b9c7da;
  }
  [data-theme="light"] {
    --bg: #eef2f7; --card: #ffffff; --card-2: #f6f8fb; --line: rgba(20,30,50,.08); --text: #172033; --muted: #66728a;
    --sun: #f5a524; --sun-core: #ffcf5c; --cloud: #7b8aa3; --cloud-dark: #4e5b72; --rain: #2f86d6; --snow: #6d9ccc; --bolt: #e9a800; --wind: #6c7c95;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; transition: background .3s, color .3s; --icon-size: 96px; }
  .wrap { width: min(1040px, 100% - 32px); margin: 0 auto; padding: 36px 0 56px; }
  header { display: flex; flex-wrap: wrap; align-items: end; gap: 18px 28px; margin-bottom: 28px; }
  h1 { margin: 0; font-size: clamp(26px, 4vw, 38px); letter-spacing: -.02em; }
  header p { margin: 4px 0 0; color: var(--muted); }
  .controls { margin-inline-start: auto; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .controls label { color: var(--muted); font-size: 13px; display: flex; gap: 10px; align-items: center; }
  input[type=range] { width: 150px; accent-color: var(--sun); }
  button { font: inherit; font-weight: 600; font-size: 14px; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px; cursor: pointer; min-height: 40px; }
  button[aria-pressed="true"] { background: var(--sun); color: #2b1d00; border-color: transparent; }
  :focus-visible { outline: 2px solid var(--sun); outline-offset: 3px; }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
  .card { background: linear-gradient(180deg, var(--card), var(--card-2)); border: 1px solid var(--line); border-radius: 22px; padding: 22px; display: grid; grid-template-rows: auto auto auto; justify-items: center; text-align: center; min-height: 240px; align-content: center; box-shadow: 0 20px 40px -30px rgba(0,0,0,.6); }
  .card h2 { margin: 12px 0 2px; font-size: 17px; }
  .card p { margin: 0; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
  .wx-icon { width: var(--icon-size); height: var(--icon-size); overflow: visible; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .wx-icon .cloud { fill: var(--cloud); stroke: none; }
  .wx-icon .cloud.dark { fill: var(--cloud-dark); }
  .wx-icon .sun-core { fill: var(--sun); }
  .wx-icon .rays line { stroke: var(--sun); }
  * { transform-box: fill-box; }
  /* clear */
  .clear .rays { transform-origin: 32px 32px; transform-box: view-box; animation: spin 18s linear infinite; }
  .clear .rays line { animation: ray 3s ease-in-out infinite; transform-origin: center; }
  .clear .sun-core { transform-origin: center; animation: breathe 3s ease-in-out infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes ray { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .55; transform: scale(.7); } }
  @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  /* partly cloudy */
  .partly .rays { transform-origin: 24px 24px; transform-box: view-box; animation: spin 24s linear infinite; }
  .partly .drift { animation: drift 6s ease-in-out infinite alternate; }
  @keyframes drift { from { transform: translateX(-2.5px); } to { transform: translateX(3px); } }
  /* rain */
  .rain .drop { stroke: var(--rain); animation: fall 1.4s cubic-bezier(.5,0,.9,.6) infinite; }
  .rain .drop:nth-child(2) { animation-delay: -.45s; } .rain .drop:nth-child(3) { animation-delay: -.9s; } .rain .drop:nth-child(4) { animation-delay: -.2s; }
  @keyframes fall { 0% { transform: translateY(-5px); opacity: 0; } 15% { opacity: 1; } 75% { opacity: .9; } 100% { transform: translateY(11px); opacity: 0; } }
  /* snow */
  .snow .flake { animation: snowfall 3.6s linear infinite; }
  .snow .flake g { animation: sway 1.8s ease-in-out infinite alternate; }
  .snow .flake path { stroke: var(--snow); stroke-width: 1.6; }
  .snow .flake:nth-child(2) { animation-delay: -1.2s; } .snow .flake:nth-child(3) { animation-delay: -2.4s; }
  .snow .flake:nth-child(2) g { animation-delay: -.6s; } .snow .flake:nth-child(3) g { animation-delay: -1.2s; }
  @keyframes snowfall { 0% { transform: translateY(-4px); opacity: 0; } 15% { opacity: 1; } 80% { opacity: 1; } 100% { transform: translateY(13px); opacity: 0; } }
  @keyframes sway { from { transform: translateX(-2.5px) rotate(-20deg); } to { transform: translateX(2.5px) rotate(20deg); } }
  /* thunderstorm */
  .storm .bolt { fill: var(--bolt); stroke: none; animation: flash 3.2s linear infinite; }
  .storm .cloud { animation: flicker 3.2s linear infinite; }
  .storm .drop { stroke: var(--rain); opacity: .7; animation: fall 1.1s cubic-bezier(.5,0,.9,.6) infinite; }
  .storm .drop:last-child { animation-delay: -.55s; }
  @keyframes flash { 0%, 62% { opacity: .12; } 64% { opacity: 1; } 67% { opacity: .25; } 70% { opacity: 1; } 76%, 100% { opacity: .12; } }
  @keyframes flicker { 0%, 62% { filter: none; } 64%, 70% { filter: brightness(1.35); } 67% { filter: none; } 76%, 100% { filter: none; } }
  /* wind */
  .wind path { stroke: var(--wind); stroke-dasharray: 100; animation: gust 3.6s ease-in-out infinite; }
  .wind path:nth-child(2) { animation-delay: -.5s; } .wind path:nth-child(3) { animation-delay: -1s; }
  @keyframes gust { 0% { stroke-dashoffset: 100; } 45% { stroke-dashoffset: 0; } 55% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -100; } }
  /* controls */
  .paused .wx-icon, .paused .wx-icon * { animation-play-state: paused !important; }
  @media (prefers-reduced-motion: reduce) {
    .wx-icon, .wx-icon * { animation: none !important; }
    .storm .bolt { opacity: 1; }
    .wind path { stroke-dashoffset: 0; }
  }
  @media (max-width: 760px) {
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .card { padding: 16px 10px; min-height: 190px; }
    .controls { margin-inline-start: 0; width: 100%; }
    input[type=range] { width: 120px; }
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <path id="cloud" d="M20 48h25.5a10.5 10.5 0 0 0 1.4-20.9A14 14 0 0 0 20.3 25 11.5 11.5 0 0 0 20 48z"/>
    <path id="cloud-high" d="M20 40h25.5a10.5 10.5 0 0 0 1.4-20.9A14 14 0 0 0 20.3 17 11.5 11.5 0 0 0 20 40z"/>
  </defs>
</svg>
<div class="wrap">
  <header>
    <div><h1>Weather, animated</h1><p>Six looping icons on one 64-unit grid with a shared 2-unit stroke.</p></div>
    <div class="controls">
      <label for="icon-size">Size <input type="range" id="icon-size" min="32" max="160" value="96"></label>
      <button type="button" id="motion-toggle" aria-pressed="false">Pause motion</button>
      <button type="button" id="theme-toggle" aria-pressed="false">Light theme</button>
    </div>
  </header>
  <main class="grid" id="icons">
    <article class="card">
      <svg class="wx-icon clear" role="img" viewBox="0 0 64 64"><title>Clear</title>
        <g class="rays"><line x1="32" y1="9" x2="32" y2="14"/><line x1="32" y1="50" x2="32" y2="55"/><line x1="9" y1="32" x2="14" y2="32"/><line x1="50" y1="32" x2="55" y2="32"/><line x1="15.7" y1="15.7" x2="19.3" y2="19.3"/><line x1="44.7" y1="44.7" x2="48.3" y2="48.3"/><line x1="15.7" y1="48.3" x2="19.3" y2="44.7"/><line x1="44.7" y1="19.3" x2="48.3" y2="15.7"/></g>
        <circle class="sun-core" cx="32" cy="32" r="11"/>
      </svg>
      <h2>Clear</h2><p>Clear · 24°</p>
    </article>
    <article class="card">
      <svg class="wx-icon partly" role="img" viewBox="0 0 64 64"><title>Partly cloudy</title>
        <g class="rays"><line x1="24" y1="6" x2="24" y2="10"/><line x1="6" y1="24" x2="10" y2="24"/><line x1="11.3" y1="11.3" x2="14.1" y2="14.1"/><line x1="36.7" y1="11.3" x2="33.9" y2="14.1"/><line x1="11.3" y1="36.7" x2="14.1" y2="33.9"/></g>
        <circle class="sun-core" cx="24" cy="24" r="8.5"/>
        <g class="drift"><use class="cloud" href="#cloud" transform="translate(4 2)"/></g>
      </svg>
      <h2>Partly cloudy</h2><p>Partly cloudy · 19°</p>
    </article>
    <article class="card">
      <svg class="wx-icon rain" role="img" viewBox="0 0 64 64"><title>Rain</title>
        <use class="cloud" href="#cloud-high"/>
        <g><line class="drop" x1="23" y1="46" x2="21" y2="51"/><line class="drop" x1="31" y1="46" x2="29" y2="51"/><line class="drop" x1="39" y1="46" x2="37" y2="51"/><line class="drop" x1="47" y1="44" x2="45" y2="49"/></g>
      </svg>
      <h2>Rain</h2><p>Showers · 14°</p>
    </article>
    <article class="card">
      <svg class="wx-icon snow" role="img" viewBox="0 0 64 64"><title>Snow</title>
        <use class="cloud" href="#cloud-high"/>
        <g>
          <g class="flake" transform="translate(24 47)"><g><path d="M0-3.5v7M-3 -1.75l6 3.5M-3 1.75l6-3.5"/></g></g>
          <g class="flake" transform="translate(34 49)"><g><path d="M0-3.5v7M-3 -1.75l6 3.5M-3 1.75l6-3.5"/></g></g>
          <g class="flake" transform="translate(43 46)"><g><path d="M0-3.5v7M-3 -1.75l6 3.5M-3 1.75l6-3.5"/></g></g>
        </g>
      </svg>
      <h2>Snow</h2><p>Light snow · −2°</p>
    </article>
    <article class="card">
      <svg class="wx-icon storm" role="img" viewBox="0 0 64 64"><title>Thunderstorm</title>
        <use class="cloud dark" href="#cloud-high"/>
        <path class="bolt" d="M34 38l-7 11h6l-3 10 9-13h-6l3-8z"/>
        <g><line class="drop" x1="22" y1="45" x2="20" y2="50"/><line class="drop" x1="44" y1="45" x2="42" y2="50"/></g>
      </svg>
      <h2>Thunderstorm</h2><p>Storms · 21°</p>
    </article>
    <article class="card">
      <svg class="wx-icon wind" role="img" viewBox="0 0 64 64"><title>Wind</title>
        <g>
          <path pathLength="100" d="M8 26h30a6 6 0 1 0-6-6"/>
          <path pathLength="100" d="M8 34h40a7 7 0 1 1-7 7"/>
          <path pathLength="100" d="M12 42h16"/>
        </g>
      </svg>
      <h2>Wind</h2><p>Breezy · 30 km/h</p>
    </article>
  </main>
</div>
<script>
(() => {
  'use strict';
  const body = document.body, root = document.documentElement;
  const motion = document.getElementById('motion-toggle');
  motion.addEventListener('click', () => {
    const paused = !body.classList.contains('paused');
    body.classList.toggle('paused', paused);
    motion.setAttribute('aria-pressed', String(paused));
    motion.textContent = paused ? 'Resume motion' : 'Pause motion';
  });
  const size = document.getElementById('icon-size');
  size.addEventListener('input', () => body.style.setProperty('--icon-size', size.value + 'px'));
  const theme = document.getElementById('theme-toggle');
  theme.addEventListener('click', () => {
    const light = root.dataset.theme !== 'light';
    root.dataset.theme = light ? 'light' : 'dark';
    theme.setAttribute('aria-pressed', String(light));
  });
})();
</script>
</body>
</html>
