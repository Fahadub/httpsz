<!doctype html>
<!-- WB-ORACLE -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Stackfall — falling-block puzzle</title>
<style>
  :root { --bg: #0b0d17; --panel: #141829; --line: #252b45; --text: #e9ecf8; --muted: #8a92b2; --accent: #8bd3ff; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: radial-gradient(900px 500px at 50% 0%, #1b2140, var(--bg) 70%); color: var(--text); font: 14px/1.35 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; -webkit-tap-highlight-color: transparent; }
  .game { height: 100%; display: grid; grid-template-columns: 1fr auto 1fr; grid-template-areas: "left well right"; gap: 22px; padding: 18px; align-items: center; }
  .left { grid-area: left; justify-self: end; display: flex; flex-direction: column; gap: 14px; width: 150px; }
  .right { grid-area: right; justify-self: start; display: flex; flex-direction: column; gap: 14px; width: 150px; }
  .panel { background: rgba(20,24,41,.85); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
  .panel h2 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .14em; color: var(--muted); font-weight: 700; }
  .panel canvas { display: block; margin: 0 auto; }
  .num { font: 700 22px/1.1 ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
  .stats { display: grid; gap: 10px; }
  .wellwrap { grid-area: well; position: relative; }
  #well { display: block; border-radius: 10px; background: #0a0c16; box-shadow: 0 0 0 1px var(--line), 0 30px 80px -20px rgba(0,0,0,.8), 0 0 60px -20px rgba(139,211,255,.25); }
  .overlay { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(8,10,20,.72); backdrop-filter: blur(2px); border-radius: 10px; text-align: center; }
  .overlay[hidden] { display: none; }
  .overlay h3 { font-size: 26px; margin: 0 0 6px; letter-spacing: .02em; }
  .overlay p { color: var(--muted); margin: 0 0 14px; }
  .overlay button { font: inherit; font-weight: 700; border: 0; border-radius: 10px; padding: 10px 18px; background: var(--accent); color: #062033; cursor: pointer; }
  .keys { color: var(--muted); font-size: 12px; line-height: 1.7; }
  kbd { font: 600 11px ui-monospace, Menlo, monospace; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; color: var(--text); }
  .touch { display: none; }
  .touch button { height: 52px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font: 600 18px system-ui; touch-action: manipulation; }
  .touch button:active { background: #232a48; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (max-width: 700px) {
    .game { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; grid-template-areas: "top" "well" "touch"; gap: 8px; padding: 10px 10px 12px; height: 100%; }
    .left, .right { display: contents; }
    .topbar { grid-area: top; display: grid; grid-template-columns: 64px 1fr 1fr 1fr 64px; gap: 6px; align-items: stretch; }
    .panel { padding: 6px 8px; border-radius: 10px; }
    .panel h2 { font-size: 9px; margin-bottom: 2px; }
    .num { font-size: 15px; }
    .stats { display: contents; }
    .keys { display: none; }
    .wellwrap { justify-self: center; align-self: center; }
    .touch { grid-area: touch; display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  }
  @media (min-width: 701px) { .topbar { display: contents; } }
</style>
</head>
<body>
<div class="game">
  <div class="topbar">
    <div class="left">
      <section class="panel" aria-label="Hold"><h2>Hold</h2><div id="hold"><canvas width="96" height="64" aria-hidden="true"></canvas></div></section>
      <div class="stats">
        <section class="panel"><h2>Score</h2><div class="num" id="score">0</div></section>
        <section class="panel"><h2>Lines</h2><div class="num" id="lines">0</div></section>
        <section class="panel"><h2>Level</h2><div class="num" id="level">1</div></section>
      </div>
    </div>
    <div class="right">
      <section class="panel" aria-label="Next pieces"><h2>Next</h2><div id="next"><canvas width="96" height="190" aria-hidden="true"></canvas></div></section>
      <div class="keys"><kbd>←</kbd> <kbd>→</kbd> move · <kbd>↓</kbd> soft drop<br><kbd>Space</kbd> hard drop<br><kbd>↑</kbd>/<kbd>X</kbd> rotate · <kbd>Z</kbd> ccw<br><kbd>C</kbd> hold · <kbd>P</kbd> pause</div>
    </div>
  </div>
  <div class="wellwrap">
    <canvas id="well" role="img" aria-label="Playfield"></canvas>
    <div class="overlay" id="overlay" hidden>
      <div><h3 id="ov-title">Paused</h3><p id="ov-text">Press P to resume</p><button type="button" id="ov-btn">Resume</button></div>
    </div>
  </div>
  <div class="touch" aria-label="Touch controls">
    <button type="button" data-act="left" aria-label="Move left">◀</button>
    <button type="button" data-act="right" aria-label="Move right">▶</button>
    <button type="button" data-act="cw" aria-label="Rotate">⟳</button>
    <button type="button" data-act="soft" aria-label="Soft drop">▼</button>
    <button type="button" data-act="hard" aria-label="Hard drop">⤓</button>
    <button type="button" data-act="hold" aria-label="Hold piece">H</button>
  </div>
</div>

<script>
(() => {
  'use strict';
  const COLS = 10, ROWS = 20, HIDDEN = 2, TOTAL = ROWS + HIDDEN;
  const DAS = 170, ARR = 50, LOCK_MS = 500, MAX_RESETS = 15, CLEAR_MS = 220;
  const COLORS = { I: '#5ad1e8', O: '#f2cf4a', T: '#b07cf0', S: '#6fd67a', Z: '#f0606e', J: '#5b8cf0', L: '#f29a4a' };
  // SRS shapes in spawn orientation (state 0) on their bounding box.
  const SHAPES = {
    I: [[0, 1], [1, 1], [2, 1], [3, 1]], O: [[1, 0], [2, 0], [1, 1], [2, 1]],
    T: [[1, 0], [0, 1], [1, 1], [2, 1]], S: [[1, 0], [2, 0], [0, 1], [1, 1]],
    Z: [[0, 0], [1, 0], [1, 1], [2, 1]], J: [[0, 0], [0, 1], [1, 1], [2, 1]], L: [[2, 0], [0, 1], [1, 1], [2, 1]],
  };
  const SIZE = { I: 4, O: 4, T: 3, S: 3, Z: 3, J: 3, L: 3 };
  // SRS kick data (x right, y up) for transitions 0>R, R>2, 2>L, L>0 (clockwise); ccw uses the negation of the reverse.
  const KICKS = {
    JLSTZ: { '0>1': [[0, 0], [-1, 0], [-1, 1], [0, -2], [-1, -2]], '1>2': [[0, 0], [1, 0], [1, -1], [0, 2], [1, 2]],
      '2>3': [[0, 0], [1, 0], [1, 1], [0, -2], [1, -2]], '3>0': [[0, 0], [-1, 0], [-1, -1], [0, 2], [-1, 2]] },
    I: { '0>1': [[0, 0], [-2, 0], [1, 0], [-2, -1], [1, 2]], '1>2': [[0, 0], [-1, 0], [2, 0], [-1, 2], [2, -1]],
      '2>3': [[0, 0], [2, 0], [-1, 0], [2, 1], [-1, -2]], '3>0': [[0, 0], [1, 0], [-2, 0], [1, -2], [-2, 1]] },
  };
  const SCORES = [0, 100, 300, 500, 800];

  const well = document.getElementById('well');
  const ctx = well.getContext('2d');
  const holdCv = document.querySelector('#hold canvas'), nextCv = document.querySelector('#next canvas');
  const overlay = document.getElementById('overlay');
  let cell = 30, dpr = 1;
  let grid, bag, queue, cur, holdType, holdUsed, score, lines, level, state, gravAcc, lockTimer, lockResets, clearing, lowestY;
  const keys = { left: false, right: false, down: false };
  let dasDir = 0, dasTimer = 0, arrTimer = 0;

  function rotateCells(type, r) {
    const n = SIZE[type];
    let cells = SHAPES[type].map(([x, y]) => [x, y]);
    for (let i = 0; i < r; i++) cells = cells.map(([x, y]) => [n - 1 - y, x]);
    return cells;
  }
  function refillBag() {
    const b = Object.keys(SHAPES);
    for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; }
    return b;
  }
  function nextType() { if (!bag.length) bag = refillBag(); return bag.pop(); }
  function spawn(type) {
    // 0-based columns: I 3-6, O 4-5 (via its 4-wide box), others 3-5. Row 1 puts the lowest cells in the first visible row.
    cur = { type, r: 0, x: 3, y: 1 };
    lockTimer = 0; lockResets = 0; lowestY = cur.y;
    if (collides(cur.x, cur.y, cur.r)) gameOver();
  }
  function takeNext() {
    const t = queue.shift(); queue.push(nextType());
    holdUsed = false;
    spawn(t);
    drawSide();
  }
  function cellsOf(p, x = p.x, y = p.y, r = p.r) { return rotateCells(p.type, r).map(([cx, cy]) => [x + cx, y + cy]); }
  function collides(x, y, r, p = cur) {
    return cellsOf(p, x, y, r).some(([cx, cy]) => cx < 0 || cx >= COLS || cy >= TOTAL || (cy >= 0 && grid[cy][cx]));
  }
  function onGround() { return collides(cur.x, cur.y + 1, cur.r); }
  function resetLock() { if (onGround() && lockResets < MAX_RESETS) { lockTimer = 0; lockResets++; } }
  function move(dx) {
    if (state !== 'play' || clearing) return false;
    if (!collides(cur.x + dx, cur.y, cur.r)) { cur.x += dx; resetLock(); return true; }
    return false;
  }
  function rotate(dir) {
    if (state !== 'play' || clearing || cur.type === 'O') return;
    const from = cur.r, to = (cur.r + (dir > 0 ? 1 : 3)) % 4;
    const table = cur.type === 'I' ? KICKS.I : KICKS.JLSTZ;
    const kicks = dir > 0 ? table[`${from}>${to}`] : table[`${to}>${from}`].map(([x, y]) => [-x, -y]);
    for (const [kx, ky] of kicks) {
      if (!collides(cur.x + kx, cur.y - ky, to)) { cur.x += kx; cur.y -= ky; cur.r = to; resetLock(); return; }
    }
  }
  function softStep() {
    if (!collides(cur.x, cur.y + 1, cur.r)) { cur.y++; if (cur.y > lowestY) { lowestY = cur.y; lockResets = 0; } return true; }
    return false;
  }
  function hardDrop() {
    if (state !== 'play' || clearing) return;
    let n = 0;
    while (softStep()) n++;
    score += 2 * n;
    lock();
  }
  function hold() {
    if (state !== 'play' || clearing || holdUsed) return;
    const t = cur.type;
    if (holdType) { const h = holdType; holdType = t; spawn(h); } else { holdType = t; takeNext(); }
    holdUsed = true;
    drawSide();
  }
  function lock() {
    const cells = cellsOf(cur);
    if (cells.every(([, y]) => y < HIDDEN)) { gameOver(); return; }
    cells.forEach(([x, y]) => { if (y >= 0) grid[y][x] = cur.type; });
    const full = [];
    for (let y = 0; y < TOTAL; y++) if (grid[y].every(Boolean)) full.push(y);
    if (full.length) {
      clearing = { rows: full, t: 0 };
      score += SCORES[full.length] * level;
      cur = null;
    } else takeNext();
    updateHud();
  }
  function finishClear() {
    const rows = clearing.rows;
    grid = grid.filter((_, y) => !rows.includes(y));
    while (grid.length < TOTAL) grid.unshift(Array(COLS).fill(null));
    lines += rows.length;
    level = 1 + Math.floor(lines / 10);
    clearing = null;
    updateHud();
    takeNext();
  }
  const gravityMs = () => Math.pow(0.8 - (level - 1) * 0.007, level - 1) * 1000;
  function updateHud() {
    document.getElementById('score').textContent = score.toLocaleString('en-US');
    document.getElementById('lines').textContent = lines;
    document.getElementById('level').textContent = level;
  }
  function showOverlay(title, text, btn) {
    document.getElementById('ov-title').textContent = title;
    document.getElementById('ov-text').textContent = text;
    document.getElementById('ov-btn').textContent = btn;
    overlay.hidden = false;
  }
  function gameOver() { state = 'over'; showOverlay('Game over', `Final score ${score.toLocaleString('en-US')} · Press Enter to play again`, 'Play again'); }
  function togglePause() {
    if (state === 'play') { state = 'paused'; showOverlay('Paused', 'Press P to resume', 'Resume'); }
    else if (state === 'paused') { state = 'play'; overlay.hidden = true; }
  }
  function newGame() {
    grid = Array.from({ length: TOTAL }, () => Array(COLS).fill(null));
    bag = []; queue = [nextType(), nextType(), nextType()]; holdType = null; holdUsed = false;
    score = 0; lines = 0; level = 1; gravAcc = 0; clearing = null; state = 'play';
    overlay.hidden = true;
    takeNext(); updateHud();
  }

  // ---------- loop ----------
  let last = performance.now();
  function tick(now) {
    const dt = Math.min(100, now - last); last = now;
    if (state === 'play') {
      if (clearing) { clearing.t += dt; if (clearing.t >= CLEAR_MS) finishClear(); }
      else if (cur) {
        // auto-shift
        if (dasDir) {
          dasTimer += dt;
          if (dasTimer >= DAS) { arrTimer += dt; while (arrTimer >= ARR) { arrTimer -= ARR; if (!move(dasDir)) break; } }
        }
        const interval = keys.down ? Math.min(50, gravityMs() / 20) : gravityMs();
        gravAcc += dt;
        while (gravAcc >= interval && cur) {
          gravAcc -= interval;
          if (softStep()) { if (keys.down) { score += 1; updateHud(); } } else { gravAcc = 0; break; }
        }
        if (cur && onGround()) { lockTimer += dt; if (lockTimer >= LOCK_MS) lock(); } else lockTimer = 0;
      }
    }
    draw(now);
    requestAnimationFrame(tick);
  }

  // ---------- drawing ----------
  function resize() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    const mobile = innerWidth <= 700;
    const availH = mobile ? innerHeight - 200 : innerHeight - 40;
    const availW = mobile ? innerWidth - 24 : innerWidth - 400;
    cell = Math.max(12, Math.floor(Math.min(availH / ROWS, availW / COLS, 36)));
    well.width = COLS * cell * dpr; well.height = ROWS * cell * dpr;
    well.style.width = COLS * cell + 'px'; well.style.height = ROWS * cell + 'px';
    const side = mobile ? 0.55 : 1;
    holdCv.width = 96 * dpr; holdCv.height = 64 * dpr; holdCv.style.width = 96 * side + 'px'; holdCv.style.height = 64 * side + 'px';
    nextCv.width = 96 * dpr; nextCv.height = (mobile ? 64 : 190) * dpr; nextCv.style.width = 96 * side + 'px'; nextCv.style.height = (mobile ? 64 : 190) * side + 'px';
    drawSide();
  }
  function block(c, x, y, s, color, alpha = 1) {
    c.globalAlpha = alpha;
    const g = c.createLinearGradient(x, y, x, y + s);
    g.addColorStop(0, color); g.addColorStop(1, shade(color, -28));
    c.fillStyle = g; c.beginPath(); c.roundRect(x + 1, y + 1, s - 2, s - 2, s * 0.18); c.fill();
    c.fillStyle = 'rgba(255,255,255,.28)'; c.beginPath(); c.roundRect(x + 3, y + 3, s - 6, s * 0.22, s * 0.1); c.fill();
    c.globalAlpha = 1;
  }
  function shade(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    const f = (v) => Math.max(0, Math.min(255, v + amt));
    return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`;
  }
  function draw(now) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, COLS * cell, ROWS * cell);
    ctx.strokeStyle = 'rgba(139,211,255,.06)'; ctx.lineWidth = 1;
    for (let x = 1; x < COLS; x++) { ctx.beginPath(); ctx.moveTo(x * cell + .5, 0); ctx.lineTo(x * cell + .5, ROWS * cell); ctx.stroke(); }
    for (let y = 1; y < ROWS; y++) { ctx.beginPath(); ctx.moveTo(0, y * cell + .5); ctx.lineTo(COLS * cell, y * cell + .5); ctx.stroke(); }
    for (let y = HIDDEN; y < TOTAL; y++) for (let x = 0; x < COLS; x++) {
      const t = grid[y][x];
      if (!t) continue;
      const flash = clearing && clearing.rows.includes(y);
      if (flash) {
        const k = clearing.t / CLEAR_MS;
        ctx.fillStyle = `rgba(255,255,255,${1 - k})`; ctx.fillRect(x * cell, (y - HIDDEN) * cell, cell, cell);
      } else block(ctx, x * cell, (y - HIDDEN) * cell, cell, COLORS[t]);
    }
    if (cur && state !== 'over') {
      let gy = cur.y; while (!collides(cur.x, gy + 1, cur.r)) gy++;
      cellsOf(cur, cur.x, gy).forEach(([x, y]) => { if (y >= HIDDEN) { ctx.strokeStyle = COLORS[cur.type]; ctx.globalAlpha = .55; ctx.lineWidth = 2; ctx.strokeRect(x * cell + 3, (y - HIDDEN) * cell + 3, cell - 6, cell - 6); ctx.globalAlpha = 1; } });
      const lockFade = onGround() ? 1 - 0.35 * Math.min(1, lockTimer / LOCK_MS) : 1;
      cellsOf(cur).forEach(([x, y]) => { if (y >= HIDDEN) block(ctx, x * cell, (y - HIDDEN) * cell, cell, COLORS[cur.type], lockFade); });
    }
  }
  function mini(c, type, ox, oy, s) {
    const cells = rotateCells(type, 0);
    const minX = Math.min(...cells.map((p) => p[0])), maxX = Math.max(...cells.map((p) => p[0]));
    const minY = Math.min(...cells.map((p) => p[1])), maxY = Math.max(...cells.map((p) => p[1]));
    const w = (maxX - minX + 1) * s, h = (maxY - minY + 1) * s;
    cells.forEach(([x, y]) => block(c, ox - w / 2 + (x - minX) * s, oy - h / 2 + (y - minY) * s, s, COLORS[type], c === holdCv.getContext('2d') && holdUsed ? 0.4 : 1));
  }
  function drawSide() {
    if (!queue) return;
    const hc = holdCv.getContext('2d'), nc = nextCv.getContext('2d');
    hc.setTransform(dpr, 0, 0, dpr, 0, 0); nc.setTransform(dpr, 0, 0, dpr, 0, 0);
    hc.clearRect(0, 0, 96, 64); nc.clearRect(0, 0, 96, 190);
    if (holdType) mini(hc, holdType, 48, 32, 18);
    const mobile = innerWidth <= 700;
    if (mobile) mini(nc, queue[0], 48, 32, 18);
    else queue.forEach((t, i) => mini(nc, t, 48, 32 + i * 62, i === 0 ? 20 : 16));
  }

  // ---------- input ----------
  const press = (dir) => { keys[dir < 0 ? 'left' : 'right'] = true; dasDir = dir; dasTimer = 0; arrTimer = 0; move(dir); };
  const release = (dir) => { keys[dir < 0 ? 'left' : 'right'] = false; if (dasDir === dir) { dasDir = keys.left ? -1 : keys.right ? 1 : 0; dasTimer = 0; arrTimer = 0; } };
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && state === 'over') { e.preventDefault(); newGame(); return; }
    if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') { e.preventDefault(); togglePause(); return; }
    if (state !== 'play') return;
    const k = e.key;
    if (['ArrowLeft', 'ArrowRight', 'ArrowDown', 'ArrowUp', ' '].includes(k)) e.preventDefault();
    if (e.repeat && (k === 'ArrowLeft' || k === 'ArrowRight' || k === 'ArrowDown')) return; // own DAS/ARR
    if (k === 'ArrowLeft') press(-1);
    else if (k === 'ArrowRight') press(1);
    else if (k === 'ArrowDown') { keys.down = true; if (cur && !clearing && softStep()) { score += 1; updateHud(); } gravAcc = 0; }
    else if (k === ' ') hardDrop();
    else if (k === 'ArrowUp' || k === 'x' || k === 'X') rotate(1);
    else if (k === 'z' || k === 'Z') rotate(-1);
    else if (k === 'c' || k === 'C' || k === 'Shift') hold();
  });
  document.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowLeft') release(-1);
    else if (e.key === 'ArrowRight') release(1);
    else if (e.key === 'ArrowDown') keys.down = false;
  });
  window.addEventListener('blur', () => { keys.left = keys.right = keys.down = false; dasDir = 0; if (state === 'play') togglePause(); });
  document.getElementById('ov-btn').addEventListener('click', () => { if (state === 'over') newGame(); else togglePause(); });
  document.querySelectorAll('.touch button').forEach((b) => {
    const act = b.dataset.act;
    b.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      if (state !== 'play') return;
      if (act === 'left') press(-1); else if (act === 'right') press(1);
      else if (act === 'cw') rotate(1); else if (act === 'hard') hardDrop(); else if (act === 'hold') hold();
      else if (act === 'soft') { keys.down = true; if (cur && !clearing && softStep()) { score += 1; updateHud(); } }
    });
    const up = () => { if (act === 'left') release(-1); else if (act === 'right') release(1); else if (act === 'soft') keys.down = false; };
    b.addEventListener('pointerup', up); b.addEventListener('pointerleave', up); b.addEventListener('pointercancel', up);
  });
  window.addEventListener('resize', resize);

  newGame();
  resize();
  requestAnimationFrame((t) => { last = t; tick(t); });
})();
</script>
</body>
</html>
