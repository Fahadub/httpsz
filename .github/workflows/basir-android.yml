# يبني تطبيق بصير للأندرويد (APK) تلقائياً، وينشره برابط تنزيل مباشر لا يحتاج تسجيل دخول:
#   https://github.com/Fahadub/httpsz/releases/download/basir-android-latest/basir.apk
name: Basir Android APK

on:
  workflow_dispatch:
    inputs:
      server:
        description: "عنوان خادم بصير الافتراضي (اختياري) مثل http://192.168.1.10:7777"
        required: false
        default: ""
  push:
    paths:
      - "basir/**"
      - ".github/workflows/basir-android.yml"

permissions:
  contents: write # لنشر الـ APK في الإصدار basir-android-latest

# بناءان متتاليان لا ينشران في الوقت نفسه
concurrency:
  group: basir-android-release
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: basir/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: basir/mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          # الحزمة الافتراضية "tools" أُزيلت من مستودع أندرويد؛ Gradle ينزّل الباقي تلقائياً
          packages: platform-tools

      - name: Install Capacitor
        run: npm ci

      - name: Build web assets
        env:
          BASIR_SERVER: ${{ inputs.server }}
        run: node scripts/build-www.mjs

      - name: Create and patch Android project
        run: |
          npx cap add android
          node scripts/patch-android.mjs
          npx cap sync android

      - name: Build debug APK
        working-directory: basir/mobile/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: basir-android-apk
          path: basir/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # رابط ثابت مباشر للجوال (بلا zip وبلا تسجيل دخول). يُستبدل بكل بناء جديد.
      - name: Publish the APK as a direct download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk basir.apk
          gh release delete basir-android-latest --yes --cleanup-tag || true
          gh release create basir-android-latest basir.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title "بصير — تطبيق أندرويد (آخر نسخة تجريبية)" \
            --notes "نسخة تجريبية من آخر تعديل (${GITHUB_SHA::7}).

          التثبيت: افتح basir.apk من الجوال، واسمح بالتثبيت من مصادر غير معروفة. إذا ظهر تحذير Play Protect فاختر «تثبيت على أي حال».
          التحديث: إذا رفض الجوال تثبيت نسخة أحدث فوق القديمة، احذف القديمة أولاً ثم ثبّت الجديدة.
          يحتاج بصير يعمل على الكمبيوتر (start.bat / start.sh) والجوال على نفس الشبكة."
