name: AppLock
options:
  deploymentTarget:
    iOS: "16.0"
targets:
  AppLock:
    type: application
    platform: iOS
    sources: [AppLock]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.applock
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSFaceIDUsageDescription: "لفتح التطبيق باستخدام Face ID"
        INFOPLIST_KEY_CFBundleDisplayName: "قفل التطبيقات"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
    info:
      path: AppLock/Info.plist
      properties:
        LSApplicationQueriesSchemes: [whatsapp, instagram, tg, fb, twitter, snapchat, tiktok]
        CFBundleURLTypes:
          - CFBundleURLSchemes: [applock]
