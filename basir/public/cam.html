<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>بصير — كاميرا إضافية</title>
  <meta name="theme-color" content="#0b1220">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="assets/app.css">
  <script src="config.js"></script>
  <script type="module" src="assets/cam.js"></script>
</head>
<body class="page">
  <main>
    <h1>كاميرا إضافية</h1>
    <p class="lead">اربط هذا الجوال ببصير ليصوّر اتجاهاً إضافياً. يمكن ربط حتى 4 جوالات: أمام ويمين وخلف ويسار. ثبّت الجوال والكاميرا الخلفية تنظر للخارج مع ميل بسيط للأسفل.</p>

    <section id="picker" class="card" aria-labelledby="pick-h">
      <h2 id="pick-h">ما اتجاه هذا الجوال بالنسبة للكفيف؟</h2>
      <div class="dirs">
        <button class="btn" type="button" data-dir="front"><span aria-hidden="true">⬆️</span>الأمام</button>
        <button class="btn" type="button" data-dir="right"><span aria-hidden="true">➡️</span>اليمين</button>
        <button class="btn" type="button" data-dir="left"><span aria-hidden="true">⬅️</span>اليسار</button>
        <button class="btn" type="button" data-dir="back"><span aria-hidden="true">⬇️</span>الخلف</button>
      </div>
    </section>

    <section id="live" class="hidden" aria-labelledby="live-h">
      <h2 id="live-h" class="hidden">البث</h2>
      <div class="cam-live">
        <video id="video" playsinline muted autoplay aria-hidden="true"></video>
        <span id="badge" class="cam-badge">…</span>
      </div>
      <p id="msg" class="notice info" role="status" aria-live="polite"></p>
      <div class="row">
        <button id="change" class="btn" type="button">تغيير الاتجاه</button>
        <button id="stop" class="btn danger" type="button">إيقاف وفصل</button>
      </div>
    </section>
  </main>
</body>
</html>
